name: Salesforce Deploy

on:
  workflow_dispatch:
    inputs:
      referenceId:
        required: true
        type: string
      requestId:
        required: false
        type: string
      targetEnvironment:
        required: true
        type: string
      commitSha:
        required: true
        type: string
      validationId:
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: salesforce-${{ inputs.targetEnvironment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved commit
    runs-on: ubuntu-latest
    environment: ${{ inputs.targetEnvironment }}
    steps:
      - name: Block unapproved production
        run: |
          if [ "${{ inputs.targetEnvironment }}" = "PROD" ] && [ "${{ vars.PRODUCTION_DEPLOYMENT_ENABLED }}" != "true" ]; then
            echo "Production deployment is disabled until lower environments are proven."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commitSha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Authenticate target org
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
        run: |
          npm install -g @salesforce/cli
          python - <<'PY'
          import os, tempfile, subprocess
          from pathlib import Path
          key = os.environ["SF_JWT_KEY"].replace("\\n", "\n")
          path = Path(tempfile.mkstemp(suffix=".key")[1])
          path.write_text(key)
          try:
              subprocess.run([
                  "sf","org","login","jwt",
                  "--client-id", os.environ["SF_CLIENT_ID"],
                  "--jwt-key-file", str(path),
                  "--username", os.environ["SF_USERNAME"],
                  "--instance-url", os.environ["SF_INSTANCE_URL"],
                  "--alias", "target-org"
              ], check=True)
          finally:
              path.unlink(missing_ok=True)
          PY

      - name: Callback deploying
        env:
          SF_CONTROL_CLIENT_ID: ${{ secrets.SF_CONTROL_CLIENT_ID }}
          SF_CONTROL_USERNAME: ${{ secrets.SF_CONTROL_USERNAME }}
          SF_CONTROL_INSTANCE_URL: ${{ secrets.SF_CONTROL_INSTANCE_URL }}
          SF_CONTROL_JWT_KEY: ${{ secrets.SF_CONTROL_JWT_KEY }}
        run: |
          python scripts/sf_control_login.py > control-auth.json
          export SF_CONTROL_ACCESS_TOKEN=$(python -c 'import json;print(json.load(open("control-auth.json"))["accessToken"])')
          export SF_CONTROL_INSTANCE_URL=$(python -c 'import json;print(json.load(open("control-auth.json"))["instanceUrl"])')
          rm -f control-auth.json
          python scripts/salesforce_callback.py \
            --requestId "${{ inputs.requestId }}" \
            --referenceId "${{ inputs.referenceId }}" \
            --workflowRunId "${GITHUB_RUN_ID}" \
            --status "Deploying" \
            --outputCommit "${{ inputs.commitSha }}"

      - name: Recreate delta against merge-base
        run: |
          BASE=$(git merge-base origin/HEAD HEAD || git rev-parse HEAD~1)
          python scripts/generate_delta.py --base "$BASE" --head HEAD --out delta

      - name: Deploy
        run: |
          python scripts/sf_control_login.py > control-auth.json
          export SF_CONTROL_ACCESS_TOKEN=$(python -c 'import json;print(json.load(open("control-auth.json"))["accessToken"])')
          export SF_CONTROL_INSTANCE_URL=$(python -c 'import json;print(json.load(open("control-auth.json"))["instanceUrl"])')
          rm -f control-auth.json
          if sf project deploy start \
              --source-dir delta/force-app \
              --target-org target-org \
              --test-level NoTestRun \
              --json > deployment-result.json; then
            python scripts/parse_deployment.py --input deployment-result.json --out deployment-summary.json
            python scripts/salesforce_callback.py \
              --referenceId "${{ inputs.referenceId }}" \
              --requestId "${{ inputs.requestId }}" \
              --workflowRunId "${GITHUB_RUN_ID}" \
              --status "Completed" \
              --deploymentStatus "Succeeded" \
              --deploymentId "$(python -c 'import json;print(json.load(open("deployment-summary.json")).get("id") or "")')" \
              --testSummary "$(python -c 'import json;d=json.load(open("deployment-summary.json"));print(str(d.get("testsRun"))+" run, "+str(d.get("testsFailed"))+" failed")')"
          else
            python scripts/parse_deployment.py --input deployment-result.json --out deployment-summary.json || true
            python scripts/salesforce_callback.py \
              --referenceId "${{ inputs.referenceId }}" \
              --requestId "${{ inputs.requestId }}" \
              --workflowRunId "${GITHUB_RUN_ID}" \
              --status "Deployment Failed" \
              --deploymentStatus "Failed" \
              --deploymentId "$(python -c 'import json;print(json.load(open("deployment-summary.json")).get("id") or "")')" \
              --errorSummary "$(python -c 'import json;print(json.load(open("deployment-summary.json")).get("message") or "Deployment failed")')"
            exit 1
          fi
